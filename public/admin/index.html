<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Content Manager</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.4.0/dist/decap-cms.js"></script>
  <script>
    document.addEventListener("click", function (e) {
      var node = e.target;
      while (node && node !== document.body) {
        var topBar = node.querySelector
          ? node.querySelector('[data-testid^="styled-list-item-top-bar-"]')
          : null;
        if (topBar) {
          var label = topBar.nextElementSibling;
          if (label && label.contains(e.target)) {
            var toggle = topBar.querySelector("button");
            if (toggle) {
              toggle.click();
            }
          }
          return;
        }
        node = node.parentElement;
      }
    }, true);
  </script>
</body>
</html>
