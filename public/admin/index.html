<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Content Manager</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <script src="https://unpkg.com/decap-cms@3.16.0/dist/decap-cms.js"></script>
  <script>
    (function () {
      var box = document.createElement("pre");
      box.setAttribute("id", "mgc-debug");
      box.style.cssText =
        "position:fixed;bottom:10px;left:10px;z-index:999999;max-width:90%;max-height:220px;overflow:auto;background:rgba(0,0,0,0.88);color:#ff6b6b;font-size:12px;font-family:monospace;padding:10px;border-radius:6px;display:none;white-space:pre-wrap;word-break:break-word;pointer-events:none;";
      document.body.appendChild(box);
      function show(msg) {
        box.style.display = "block";
        box.textContent =
          new Date().toLocaleTimeString() + " " + msg + "\n" + box.textContent;
      }
      window.addEventListener("error", function (e) {
        show("error: " + e.message + " @ " + (e.filename || "") + ":" + (e.lineno || ""));
      });
      window.addEventListener("unhandledrejection", function (e) {
        show("rejected: " + (e.reason && (e.reason.message || e.reason) || e.reason));
      });
      var origError = console.error;
      console.error = function () {
        try {
          var parts = Array.prototype.slice.call(arguments).map(function (a) {
            return a && a.message ? a.message : String(a);
          });
          show("console.error: " + parts.join(" "));
        } catch (err) {}
        origError.apply(console, arguments);
      };
    })();
  </script>
  <script>
    document.addEventListener("click", function (e) {
      if (!e.target || !e.target.closest) return;
      if (e.target.closest("button, input, select, textarea, a")) return;
      var node = e.target;
      while (node && node !== document.body) {
        var kids = node.children;
        for (var i = 0; i < kids.length; i++) {
          var top = kids[i];
          if (
            top.nodeName === "DIV" &&
            top.firstElementChild &&
            top.firstElementChild.nodeName === "BUTTON" &&
            top.firstElementChild.querySelector("svg")
          ) {
            var label = top.nextElementSibling;
            if (label && label.contains(e.target)) {
              top.firstElementChild.click();
              return;
            }
          }
        }
        node = node.parentElement;
      }
    }, true);

    (function () {
      function isCollapsibleBar(el) {
        return (
          el &&
          el.nodeName === "DIV" &&
          el.firstElementChild &&
          el.firstElementChild.nodeName === "BUTTON" &&
          el.firstElementChild.querySelector("svg")
        );
      }
      function styleLabels(root) {
        var divs = (root || document).querySelectorAll("div");
        for (var i = 0; i < divs.length; i++) {
          var d = divs[i];
          if (!isCollapsibleBar(d)) continue;
          var label = d.nextElementSibling;
          if (label && label.nodeName === "DIV" && !label.classList.contains("mgc-clickable")) {
            label.classList.add("mgc-clickable");
          }
        }
      }
      var observer = new MutationObserver(function () {
        styleLabels(document);
      });
      if (document.body) {
        styleLabels(document);
        observer.observe(document.body, { childList: true, subtree: true });
      }
    })();
  </script>
</body>
</html>
