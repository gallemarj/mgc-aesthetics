<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Content Manager</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.4.0/dist/decap-cms.js"></script>
  <script>
    document.addEventListener("click", function (e) {
      if (!e.target || !e.target.closest) return;
      if (e.target.closest("button, input, select, textarea, a")) return;
      var node = e.target;
      while (node && node !== document.body) {
        var kids = node.children;
        for (var i = 0; i < kids.length; i++) {
          var top = kids[i];
          if (
            top.nodeName === "DIV" &&
            top.firstElementChild &&
            top.firstElementChild.nodeName === "BUTTON" &&
            top.firstElementChild.querySelector("svg")
          ) {
            var label = top.nextElementSibling;
            if (label && label.contains(e.target)) {
              top.firstElementChild.click();
              return;
            }
          }
        }
        node = node.parentElement;
      }
    }, true);
  </script>
</body>
</html>
